  "const $ = id => document.getElementById(id);",
  "const SIZE = 10;",
  "const totalRanges = Math.ceil(D.length / SIZE);",
  "",
  "let selected = new Set(Array.from({length:totalRanges},(_,i)=>i));",
  "let questions = [];",
  "let pos = 0;",
  "let results = [];",
  "let graded = false;",
  "let autoNextTimer = null;",
  "",
  "// 자동 이동 예약",
  "function scheduleAutoNext() {",
  "  clearTimeout(autoNextTimer);",
  "  autoNextTimer = null;",
  "",
  "  if ($(\"autoNext\").checked && graded) {",
  "    autoNextTimer = setTimeout(() => {",
  "      autoNextTimer = null;",
  "",
  "      if (graded) {",
  "        nextQuestion();",
  "      }",
  "    }, 700);",
  "  }",

  "// 입력 답안 정리",
  "function norm(s) {",
  "  return s.toLowerCase()",
  "    .replace(/\\s+/g,\"\")",
  "    .replace(/[·ㆍ,，。.!！?？/／]/g,\"\");",
  "}",
  "",
  "// 정답 확인",
  "function matches(input, answer) {",
  "  const splitAnswers = text => text",
  "    .split(/[\\/／,，、]+/)",
  "    .map(part => norm(part))",
  "    .filter(Boolean);",
  "",
  "  const accepted = splitAnswers(answer);",
  "  const submitted = splitAnswers(input);",
  "",
  "  return submitted.length > 0 &&",
  "         submitted.every(part => accepted.includes(part));",
  "}",
  "",
  "// 문제 순서 섞기",
  "function shuffleArray(a) {",
  "  for(let i=a.length-1;i>0;i--){",
  "    const j=Math.floor(Math.random()*(i+1));",
  "    [a[i],a[j]]=[a[j],a[i]];",
  "  }",
  "  return a;",
  "}",
  "",
  "// 시험 범위 표시",
  "function renderRanges() {",
  "  const root=$(\"ranges\");",
  "  root.replaceChildren();",
  "",
  "  for(let i=0;i<totalRanges;i++){",
  "    const start=i*SIZE+1;",
  "    const end=Math.min((i+1)*SIZE,D.length);",
  "",
  "    const label=document.createElement(\"label\");",
  "    label.className=\"range\";",
  "",
  "    const cb=document.createElement(\"input\");",
  "    cb.type=\"checkbox\";",
  "    cb.checked=selected.has(i);",
  "",
  "    const txt=document.createElement(\"span\");",
  "",
  "    const strong=document.createElement(\"strong\");",
  "    strong.textContent=`${start}–${end}번`;",
  "",
  "    const small=document.createElement(\"small\");",
  "    small.textContent=`${end-start+1}개`;",
  "",
  "    txt.append(strong,small);",
  "    label.append(cb,txt);",
  "    root.append(label);",
  "",
  "    cb.addEventListener(\"change\",()=>{",
  "      cb.checked ? selected.add(i) : selected.delete(i);",
  "      updateCount();",
  "    });",
  "  }",
  "",
  "  updateCount();",
  "}",
  "",
  "// 선택한 문제 수 표시",
  "function updateCount(){",
  "  let n=0;",
  "",
  "  selected.forEach(i=>{",
  "    n+=Math.min(SIZE,D.length-i*SIZE);",
  "  });",
  "",
  "  $(\"selectedCount\").textContent=`${selected.size}개 범위 · ${n}자`;",
  "  $(\"start\").disabled=n===0;",
  "}",

  "// 시험 시작",
  "function begin(items) {",
  "  clearTimeout(autoNextTimer);",
  "  autoNextTimer = null;",
  "",
  "  questions=items.slice();",
  "",
  "  if($(\"shuffle\").checked){",
  "    shuffleArray(questions);",
  "  }",
  "",
  "  pos=0;",
  "  results=[];",
  "  graded=false;",
  "",
  "  $(\"setup\").classList.add(\"hidden\");",
  "  $(\"result\").classList.add(\"hidden\");",
  "  $(\"exam\").classList.remove(\"hidden\");",
  "",
  "  // 화면이 바뀌어도 자동 이동 설정 유지",
  "  $(\"autoNextExam\").checked=$(\"autoNext\").checked;",
  "",
  "  showQuestion();",
  "}",

  "// 선택한 범위로 문제 만들기",
  "function startExam(){",
  "  const items=[];",
  "",
  "  [...selected].sort((a,b)=>a-b).forEach(r=>{",
  "    for(let i=r*SIZE;i<Math.min((r+1)*SIZE,D.length);i++){",
  "      items.push({",
  "        d:D[i],",
  "        idx:i,",
  "        range:r",
  "      });",
  "    }",
  "  });",
  "",
  "  begin(items);",
  "}",

  "// 문제 표시",

  "  const q=questions[pos];",
  "",
  "  graded=false;",

  "  clearTimeout(autoNextTimer);",

  "  $(\"meaning\").value=\"\";",
  "  $(\"sound\").value=\"\";",

  "",
  "  $(\"remaining\").textContent=`남은 문제 ${questions.length-pos-1}개`;",

  "  const line2=document.createElement(\"span\");",

  "  [\"畫\",\"그림\",\"화\"],",
  "  [\"花\",\"꽃\",\"화\"],",
  "  [\"華\",\"빛날\",\"화\"],",
  "  [\"話\",\"말씀\",\"화\"],",
  "  [\"貨\",\"재물\",\"화\"],",
  "  [\"患\",\"근심\",\"환\"],",
  "  [\"歡\",\"기쁠\",\"환\"],",
  "  [\"活\",\"살다\",\"활\"],",
  "  [\"皇\",\"임금\",\"황\"],",
  "  [\"黃\",\"누렇다\",\"황\"],",
  "  [\"回\",\"돌다\",\"회\"],",
  "  [\"會\",\"모일\",\"회\"],",
  "  [\"孝\",\"효도\",\"효\"],",
  "  [\"效\",\"본받을\",\"효\"],",
  "  [\"厚\",\"두터울\",\"후\"],",
  "  [\"後\",\"뒤\",\"후\"],",
  "  [\"訓\",\"가르칠\",\"훈\"],",
  "  [\"休\",\"쉴\",\"휴\"],",
  "  [\"凶\",\"흉할\",\"흉\"],",
  "  [\"胸\",\"가슴\",\"흉\"],",
  "  [\"黑\",\"검을\",\"흑\"],",
  "  [\"興\",\"일다\",\"흥\"],",
  "  [\"喜\",\"기쁠\",\"희\"],",
  "  [\"希\",\"바랄\",\"희\"],",
  "];",
  "",
  "const $ = id => document.getElementById(id);",
  "const SIZE = 10;",
  "const rangeCount = Math.ceil(hanja.length / SIZE);",
  "",
  "let selectedRanges = new Set(",
  "  Array.from({length: rangeCount}, (_, i) => i)",
  ");",
  "let questions = [];",
  "let current = 0;",
  "let revealed = false;",
  "",
  "function renderRanges() {",
  "  const root = $(\"ranges\");",
  "  root.replaceChildren();",
  "",
  "  for (let i = 0; i < rangeCount; i++) {",
  "    const start = i * SIZE + 1;",
  "    const end = Math.min((i + 1) * SIZE, hanja.length);",
  "    const label = document.createElement(\"label\");",
  "    label.className = \"range\";",
  "",
  "    const checkbox = document.createElement(\"input\");",
  "    checkbox.type = \"checkbox\";",
  "    checkbox.checked = selectedRanges.has(i);",
  "",
  "    const text = document.createElement(\"span\");",
  "    const title = document.createElement(\"strong\");",
  "    title.textContent = `${start}–${end}번`;",
  "",
  "    const detail = document.createElement(\"small\");",
  "    detail.textContent = `${end - start + 1}개 한자`;",
  "",
  "    text.append(title, detail);",
  "    label.append(checkbox, text);",
  "    root.append(label);",
  "",
  "    checkbox.addEventListener(\"change\", () => {",
  "      if (checkbox.checked) selectedRanges.add(i);",
  "      else selectedRanges.delete(i);",
  "      updateSelection();",
  "    });",
  "  }",
  "",
  "  updateSelection();",
  "}",
  "",
  "function updateSelection() {",
  "  let count = 0;",
  "  for (const i of selectedRanges) {",
  "    count += Math.min(SIZE, hanja.length - i * SIZE);",
  "  }",
  "",
  "  $(\"selectedCount\").textContent =",
  "    `${selectedRanges.size}개 범위 · ${count}자 선택`;",
  "",
  "  $(\"startBtn\").disabled = count === 0;",
  "  $(\"setupMessage\").textContent = count === 0",
  "    ? \"시험을 시작하려면 범위를 하나 이상 선택하세요.\"",
  "    : \"\";",
  "}",
  "",
  "function shuffleArray(array) {",
  "  for (let i = array.length - 1; i > 0; i--) {",
  "    const j = Math.floor(Math.random() * (i + 1));",
  "    [array[i], array[j]] = [array[j], array[i]];",
  "  }",
  "  return array;",
  "}",
  "",
  "function startExam() {",
  "  questions = [];",
  "",
  "  [...selectedRanges]",
  "    .sort((a, b) => a - b)",
  "    .forEach(range => {",
  "      const start = range * SIZE;",
  "      const end = Math.min(start + SIZE, hanja.length);",
  "",
  "      for (let i = start; i < end; i++) {",
  "        questions.push({",
  "          data: hanja[i],",
  "          originalIndex: i,",
  "          range: range",
  "        });",
  "      }",
  "    });",
  "",
  "  if ($(\"shuffle\").checked) {",
  "    shuffleArray(questions);",
  "  }",
  "",
  "  current = 0;",
  "  $(\"setup\").classList.add(\"hidden\");",
  "  $(\"complete\").classList.add(\"hidden\");",
  "  $(\"exam\").classList.remove(\"hidden\");",
  "  showQuestion();",
  "}",
  "",
  "function showQuestion() {",
  "  const q = questions[current];",
  "  const [character, meaning, sound] = q.data;",
  "",
  "  revealed = false;",
  "",
  "  $(\"counter\").textContent =",
  "    `${current + 1} / ${questions.length}`;",
  "",
  "  $(\"questionNumber\").textContent =",
  "    `QUESTION ${String(current + 1).padStart(2, \"0\")}`;",
  "",
  "  $(\"progressBar\").style.width =",
  "    `${((current + 1) / questions.length) * 100}%`;",
  "",
  "  $(\"meaning\").textContent = meaning;",
  "  $(\"sound\").textContent = sound;",
  "",
  "  $(\"answer\").textContent = character;",
  "  $(\"answerDetail\").textContent =",
  "    `뜻: ${meaning} · 음: ${sound}`;",
  "",
  "  $(\"answerArea\").classList.add(\"hidden\");",
  "  $(\"revealBtn\").classList.remove(\"hidden\");",
  "  $(\"nextBtn\").classList.add(\"hidden\");",
  "",
  "  $(\"nextBtn\").textContent =",
  "    current === questions.length - 1",
  "      ? \"시험 완료\"",
  "      : \"다음 문제 →\";",
  "",
  "  const start = q.range * SIZE + 1;",
  "  const end = Math.min((q.range + 1) * SIZE, hanja.length);",
  "",
  "  $(\"rangeInfo\").textContent =",
  "    `원래 범위: ${start}–${end}번`;",
  "",
  "  $(\"remaining\").textContent =",
  "    `남은 문제 ${questions.length - current - 1}개`;",
  "}",
  "",
  "function revealAnswer() {",
  "  if (revealed) return;",
  "  revealed = true;",
  "",
  "  $(\"answerArea\").classList.remove(\"hidden\");",
  "  $(\"revealBtn\").classList.add(\"hidden\");",
  "  $(\"nextBtn\").classList.remove(\"hidden\");",
  "}",
  "",
  "function nextQuestion() {",
  "  if (!revealed) return;",
  "",
  "  if (current < questions.length - 1) {",
  "    current++;",
  "    showQuestion();",
  "  } else {",
  "    finishExam();",
  "  }",
  "}",
  "",
  "function finishExam() {",
  "  $(\"exam\").classList.add(\"hidden\");",
  "  $(\"complete\").classList.remove(\"hidden\");",
  "  $(\"result\").textContent =",
  "    `${questions.length}개 문제를 모두 확인했습니다.`;",
  "}",
  "",
  "function goHome() {",
  "  $(\"exam\").classList.add(\"hidden\");",
  "  $(\"complete\").classList.add(\"hidden\");",
  "  $(\"setup\").classList.remove(\"hidden\");",
  "  renderRanges();",
  "}",
  "",
  "$(\"selectAll\").addEventListener(\"click\", () => {",
  "  selectedRanges = new Set(",
  "    Array.from({length: rangeCount}, (_, i) => i)",
  "  );",
  "  renderRanges();",
  "});",
  "",
  "$(\"clearAll\").addEventListener(\"click\", () => {",
  "  selectedRanges.clear();",
  "  renderRanges();",
  "});",
  "",
  "$(\"startBtn\").addEventListener(\"click\", startExam);",
  "$(\"revealBtn\").addEventListener(\"click\", revealAnswer);",
  "$(\"nextBtn\").addEventListener(\"click\", nextQuestion);",
  "$(\"backBtn\").addEventListener(\"click\", goHome);",
  "$(\"homeBtn\").addEventListener(\"click\", goHome);",
  "$(\"retryBtn\").addEventListener(\"click\", startExam);",
  "",
  "renderRanges();",
  "<\/script>",
  "</body>",
  "</html>"
].join("\n");
document.getElementById('word').srcdoc = wordHTML;
document.getElementById('written').srcdoc = writtenHTML;
function mode(m) {
  for (const id of ['word', 'written']) {
    document.getElementById(id).classList.toggle('active', id === m);
  }
  document.getElementById('wordBtn').classList.toggle('active', m === 'word');
  document.getElementById('writtenBtn').classList.toggle('active', m === 'written');
}
document.getElementById('wordBtn').addEventListener('click', () => mode('word'));
document.getElementById('writtenBtn').addEventListener('click', () => mode('written'));
</script>
</body>
</html>
